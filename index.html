<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MrMWSK FLUX</title>
  <style>
    :root {
      --bg: #edf3f7;
      --panel: rgba(255,255,255,0.8);
      --soft: #f5f9fb;
      --ink: #172630;
      --muted: #5f7280;
      --line: rgba(104,131,149,0.22);
      --accent: #16865c;
      --accent-2: #2785d8;
      --shadow: 0 18px 48px rgba(37,66,84,0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 1100px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex !important;
      align-items: center;
      gap: 12px;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 900;
      letter-spacing: -0.04em;
      white-space: nowrap;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 900;
    }

    .brand-text {
      display: inline !important;
      color: var(--ink);
    }

    .brand-product {
      color: var(--accent);
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      white-space: nowrap;
    }

    .main {
      padding: 26px 20px 30px;
    }

    .hero {
      display: grid;
      gap: 8px;
      place-items: center;
      text-align: center;
      padding: 18px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .note {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.96rem;
    }

    @media (max-width: 740px) {
      body {
        padding: 12px;
      }

      .sidebar {
        flex-wrap: wrap;
        justify-content: center;
        padding: 14px 16px;
      }

      .brand,
      .brand-text,
      .brand-product,
      .label {
        display: inline-flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      .brand {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" aria-label="MrMWSK FLUX">
        <span class="brand-mark">F</span>
        <span class="brand-text">MrMWSK <span class="brand-product">FLUX</span></span>
      </div>
      <div class="label">Audit Studio</div>
    </aside>

    <main class="main">
      <div class="hero">
        <h1>MrMWSK <span class="brand-product">FLUX</span></h1>
        <p class="subtitle">Always visible in every mode.</p>
        <div class="note">The brand remains visible in the header, in responsive layouts, and in all theme states.</div>
      </div>
    </main>
  </div>
</body>
</html>
